<p-overlay [visible]="isVisible" (onHide)="hide()">
  <div class="modal">

    <div class="modal-header">
      <h2>Screen Details</h2>
    </div>

    <div class="modal-body" *ngIf="selectedScreen">

      <div class="form-group">
        <label>Name</label>
        <span>{{ selectedScreen.name }}</span>
      </div>

      <div class="form-group">
        <label>Address</label>
        <span>{{ selectedScreen.address }}</span>
      </div>

      <div class="form-group">
        <label>Location</label>
        <span>{{ selectedScreen.location }}</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Resolution</label>
          <span>{{ selectedScreen.resolution }}</span>
        </div>

        <div class="form-group">
          <label>Orientation</label>
          <p-tag
            [value]="ScreenOrientation[selectedScreen.orientation]"
            [severity]="
              selectedScreen.orientation === 1
                ? 'info'
                : selectedScreen.orientation === 2
                  ? 'secondary'
                  : 'contrast'
            "
          />
        </div>
      </div>

      <div class="form-group">
        <label>Status</label>
        <p-tag
          [value]="ScreenStatus[selectedScreen.status]"
          [severity]="
            selectedScreen.status === 1
              ? 'success'
              : selectedScreen.status === 0
                ? 'danger'
                : 'warning'
          "
        />
      </div>

      <div class="form-group">
        <label>Tags</label>
        <div class="tags">
          <p-tag
            *ngFor="let t of selectedScreen.tag"
            [value]="t"
            severity="info"
          ></p-tag>
          <span *ngIf="!selectedScreen.tag || selectedScreen.tag.length === 0">-</span>
        </div>
      </div>

      <div class="form-group">
        <label>Operating Hours</label>
      </div>

      <p-table [value]="selectedScreen.operatingHours ?? []">
        <ng-template pTemplate="header">
          <tr>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Avg Audience</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-oh>
          <tr>
            <td>{{ DayOfWeek[oh.dayOfWeek] }}</td>
            <td>{{ oh.startTime }}</td>
            <td>{{ oh.endTime }}</td>
            <td>{{ oh.avgAudienceCount }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" style="text-align: center;">
              No operating hours defined
            </td>
          </tr>
        </ng-template>
      </p-table>

    </div>

    <div class="modal-footer">
      <button
        pButton
        label="Close"
        icon="pi pi-times"
        class="p-button-sm p-button-secondary"
        (click)="hide()"
      ></button>
    </div>

  </div>
</p-overlay>
