<p-dialog
  [(visible)]="isVisible"
  [modal]="true"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  styleClass="screen-oh-dialog"
>
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Screen Operating Hours & Audience Reach</h2>
    </div>

    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Day</label>
          <p-dropdown
            [options]="dayOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="newSlot.dayOfWeek"
            placeholder="Select Day"
            appendTo="body"
          ></p-dropdown>
        </div>

        <div class="form-group">
          <label>Open Time</label>
          <p-calendar
            [(ngModel)]="startTimeDate"
            [timeOnly]="true"
            [showSeconds]="true"
            hourFormat="24"
            appendTo="body"
            placeholder="HH:mm:ss"
          />
        </div>

        <div class="form-group">
          <label>Close Time</label>
          <p-calendar
            [(ngModel)]="endTimeDate"
            [timeOnly]="true"
            [showSeconds]="true"
            hourFormat="24"
            appendTo="body"
            placeholder="HH:mm:ss"
          />
        </div>

        <div class="form-group">
          <label>Audience Count</label>
          <input type="number" min="1" [(ngModel)]="newSlot.avgAudienceCount" />
        </div>
      </div>

      <div class="form-actions">
        <button
          pButton
          icon="pi pi-plus"
          label="Add Slot"
          class="p-button-sm"
          (click)="addSlot()"
        ></button>
      </div>

      <p-table [value]="operatingHour">
        <ng-template pTemplate="header">
          <tr>
            <th>Day</th>
            <th>Open Time</th>
            <th>Close Time</th>
            <th>Audience Count</th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-soh>
          <tr>
            <td>{{ DayOfWeek[soh.dayOfWeek] }}</td>
            <td>{{ soh.startTime }}</td>
            <td>{{ soh.endTime }}</td>
            <td>{{ soh.avgAudienceCount }}</td>
            <td>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-sm p-button-danger"
                (click)="deleteSlot(soh)"
              ></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="empty-message">No slots configured</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="modal-footer">
      <button
        pButton
        label="Close"
        icon="pi pi-times"
        class="p-button-sm p-button-secondary"
        (click)="close()"
      ></button>
    </div>
  </div>
</p-dialog>
