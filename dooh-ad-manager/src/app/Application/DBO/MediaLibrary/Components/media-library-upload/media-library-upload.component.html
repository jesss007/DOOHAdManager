<p-overlay [visible]="isActive" (onHide)="onCancel()">
  <div class="modal">

    <div class="modal-header">
      <h2>Upload Media</h2>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Name</label>
        <input [(ngModel)]="name" placeholder="Enter media name" />
      </div>

      <div class="form-group">
        <label>File</label>
        <p-fileUpload
          *ngIf="showFileUpload"
          mode="basic"
          chooseLabel="Choose File"
          [auto]="false"
          accept="image/*,video/*"
          (onSelect)="onFileSelect($event)"
        /> 
      </div>

      <div class="form-group" *ngIf="previewUrl">
        <label>Preview</label>
        <img
          *ngIf="!isVideo" [src]="previewUrl" alt="Preview" class="preview-media" />
        <video
          *ngIf="isVideo" [src]="previewUrl" class="preview-media" >
        </video>
      </div>

    </div>

    <div class="modal-footer">
      <button pButton label="Cancel" icon="pi pi-times" class="p-button-sm p-button-secondary" (click)="onCancel()"></button>
      <button pButton label="Upload" icon="pi pi-upload" class="p-button-sm" [loading]="isLoading" (click)="onSubmit()"></button>
    </div>

  </div>
</p-overlay>
